<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="refresh" content="1; url=https://symtech-demo.up.railway.app/">
  <title>Opening the Symtech preview · Straden</title>
  <style>
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; background: #f5f6f7; color: #222b32; font: 16px/1.5 Arial, sans-serif; }
    main { width: min(100%, 460px); padding: 38px; border: 1px solid #e2e5e8; border-radius: 14px; background: #fff; box-shadow: 0 16px 44px #1d273015; }
    .brand { margin: 0 0 26px; color: #c30d16; font-size: 13px; font-weight: 800; letter-spacing: .13em; }
    h1 { margin: 0 0 9px; font-size: 26px; line-height: 1.2; }
    p { margin: 0 0 24px; color: #60707b; }
    a { display: inline-block; padding: 11px 17px; border-radius: 7px; background: #c30d16; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
    a:hover, a:focus-visible { background: #9e0b12; }
  </style>
</head>
<body>
  <main>
    <div class="brand">STRADEN · CLIENT PREVIEW</div>
    <h1>Opening the Symtech demo</h1>
    <p>The preview will ask for the username and password provided by Straden.</p>
    <a href="https://symtech-demo.up.railway.app/">Continue to the secure preview →</a>
  </main>
</body>
</html>
